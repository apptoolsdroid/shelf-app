<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Shelf</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#2a1c12" />
<link rel="stylesheet" href="css/style.css" />

<!-- Microsoft sign-in -->
<!-- Libraries are bundled with the app rather than pulled from a CDN: the
     reader then works with no network at all, and there is no third-party
     URL that can 404 or change out from under it. pdf.js is loaded as a
     real ES module by js/readerPdf.js (v4 ships ESM only). -->
<script src="js/vendor/msal-browser.min.js"></script>
<!-- EPUB rendering -->
<script src="js/vendor/jszip.min.js"></script>
<script src="js/vendor/epub.min.js"></script>
</head>
<body>
<div id="app">
  <div class="topbar">
    <h1 id="titleText">Shelf</h1>
    <!-- The three library actions live in the header itself, so there's only
         one bar across the top instead of two stacked ones. -->
    <div class="lib-actions" id="libActions">
      <button class="icon-btn" id="syncBtn" title="Sync" aria-label="Sync">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 13.5a3.5 3.5 0 0 1 .5-7 5 5 0 0 1 9.6 1.4A3 3 0 0 1 17 13.5"/>
          <path d="M12 11v8M12 19l2.6-2.6M12 19l-2.6-2.6"/>
        </svg>
      </button>
      <label class="icon-btn" for="localFileInput" title="Import books from this device" aria-label="Import books">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>
          <path d="M14 3v5h5"/>
          <path d="M12 12.5v5M9.5 15h5"/>
        </svg>
      </label>
      <input type="file" id="localFileInput" accept=".epub,.pdf" class="hidden" multiple />
      <label class="icon-btn" for="folderInput" title="Import a folder as its own shelf" aria-label="Import folder as new shelf">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4L11 8h8.5A1.5 1.5 0 0 1 21 9.5v8A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/>
          <path d="M12 11v5M9.5 13.5h5"/>
        </svg>
      </label>
      <input type="file" id="folderInput" class="hidden" multiple webkitdirectory directory />
    </div>
    <span class="spacer"></span>
    <button class="version-chip" id="versionChip" title="App version — tap to check for updates">v—</button>
    <span class="status-dot" id="statusDot" title="OneDrive status"></span>
    <button class="btn" id="signInBtn">Sign in</button>
    <div class="provider-menu hidden" id="providerMenu">
      <div id="providerConnect">
        <div class="provider-menu-label">Sync with</div>
        <button class="provider-item" data-provider="onedrive">Microsoft OneDrive</button>
        <button class="provider-item" data-provider="gdrive">Google Drive</button>
      </div>
      <div id="providerAccount" class="hidden">
        <div class="provider-menu-label" id="accountLabel"></div>
        <button class="provider-item" id="chooseFolderBtn">Sync folder: <span id="currentFolderName">Books</span></button>
        <div class="shelf-menu-sep"></div>
        <button class="provider-item" id="signOutBtn">Sign out</button>
      </div>
      <!-- Works with or without a cloud connection: a plain file you can move
           between devices yourself. -->
      <div class="shelf-menu-sep"></div>
      <div class="provider-menu-label">Live sync</div>
      <button class="provider-item" id="firebaseBtn">Connect Firebase…</button>
      <!-- Plain-language readout of what sync last did. Two devices with a
           server in between is precisely where "it isn't working" is
           impossible to act on without being told what the app can see. -->
      <div class="sync-status hidden" id="syncStatus"></div>
      <button class="provider-item hidden" id="syncNowBtn">Sync now</button>
      <button class="provider-item" id="trackerBtn">Which books are on this device…</button>
      <div class="shelf-menu-sep"></div>
      <div class="provider-menu-label">Backup file</div>
      <button class="provider-item" id="syncFileBtn">Sync with backup file…</button>
      <button class="provider-item" id="exportBtn">Create a new backup…</button>
      <label class="provider-item" for="importBackupInput">Restore from a backup…</label>
      <button class="provider-item" id="forgetBackupBtn">Forget saved backup file</button>
      <input type="file" id="importBackupInput" accept=".zip" class="hidden" />
    </div>
  </div>

  <div id="shelfView">
    <!-- Entry screen: the room. Every category is a bookcase you can walk up
         to; clicking one opens that category's shelf below. -->
    <div id="racksView">
      <div class="racks-grid" id="racksGrid"></div>
    </div>

    <div class="library hidden" id="libraryView">
      <div class="shelf-rail" id="shelfRail"></div>
      <div class="shelf-panel" id="shelfPanel">
        <div class="empty-state" id="emptyState">
          No books yet. Use the import buttons in the header to add EPUBs and PDFs from this device,
          or sign in and tap the cloud to pull them from your OneDrive <em>Books</em> folder.
        </div>
      </div>
    </div>
  </div>

  <div id="readerView">
    <div class="reader-toolbar">
      <button class="btn icon" id="backBtn">‹ Shelf</button>
      <button class="btn icon" id="undoBtn" title="Undo">↺</button>
      <button class="btn icon" id="redoBtn" title="Redo">↻</button>
      <button class="btn icon" id="bookmarkBtn" title="Bookmark this spot">🔖</button>
      <button class="btn icon" id="notesBtn" title="Notes canvas for this book" aria-label="Notes canvas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H18a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5.5A1.5 1.5 0 0 1 4 18.5z"/>
          <path d="M8 4v16M11 9h6M11 13h4"/>
        </svg>
      </button>

      <span class="ink-tools pdf-only hidden" id="inkTools">
        <button class="btn icon" id="penBtn" title="Draw with the pen">✏️</button>
        <button class="btn icon" id="hiliteBtn" title="Highlighter">🖍️</button>
        <button class="btn icon" id="eraserBtn" title="Erase ink">🧽</button>
        <input type="color" id="inkColor" class="ink-color" value="#c0392b" title="Ink colour" />
      </span>

      <select id="pdfViewModeSelect" class="btn hidden" title="Page view">
        <option value="single">Single page</option>
        <option value="double">Two pages (book)</option>
        <option value="scroll">Continuous scroll</option>
      </select>
      <button class="btn icon pdf-only hidden" id="prevArrowBtn" title="Previous page(s)">‹</button>
      <button class="btn icon pdf-only hidden" id="nextArrowBtn" title="Next page(s)">›</button>

      <span class="spacer"></span>
      <span id="pageInfo" class="book-sub"></span>
      <span class="spacer"></span>

      <select id="fontFamilySelect" class="btn" title="Reading typeface">
        <option value="serif">Serif</option>
        <option value="sans">Sans</option>
      </select>
      <button class="btn icon" id="fontMinusBtn">A-</button>
      <button class="btn icon" id="fontPlusBtn">A+</button>
      <button class="btn icon pdf-only hidden" id="zoomOutBtn" title="Zoom out">−</button>
      <button class="btn icon pdf-only hidden" id="zoomFitBtn" title="Fit to screen">Fit</button>
      <button class="btn icon pdf-only hidden" id="zoomInBtn" title="Zoom in">+</button>

      <button class="btn primary" id="saveBtn">Save</button>
    </div>
    <!-- The stage is what the loading/error overlay covers. The toolbar above
         it is deliberately outside, so the back button can never be hidden
         behind the overlay if a book is slow to load or fails to load. -->
    <div class="reader-stage">
      <div id="readerContainer">
        <div id="epubContainer" class="hidden"></div>
        <div id="pdfContainer" class="hidden"></div>
      </div>
      <button class="page-arrow left" id="pageArrowPrev" aria-label="Previous page">‹</button>
      <button class="page-arrow right" id="pageArrowNext" aria-label="Next page">›</button>
      <div id="readerMorphSurface" class="reader-morph-surface hidden">
        <span id="readerMorphText">Opening…</span>
        <button class="btn" id="morphBackBtn" hidden>‹ Back to shelf</button>
      </div>
    </div>
  </div>
</div>

  <!-- Notes canvas: a board per book, for working ideas out rather than
       marking up a page. Opened from the reader toolbar. -->
  <div id="notesView">
    <div class="reader-toolbar">
      <button class="btn icon" id="notesCloseBtn">‹ Back to book</button>
      <span class="ink-tools">
        <button class="btn icon" id="nPenBtn" title="Pen">✏️</button>
        <button class="btn icon" id="nHiliteBtn" title="Highlighter">🖍️</button>
        <button class="btn icon" id="nEraserBtn" title="Erase">🧽</button>
        <button class="btn icon" id="nNoteBtn" title="Place a typed note">🗒️</button>
        <input type="color" id="nInkColor" class="ink-color" value="#1c1c1c" title="Ink colour" />
      </span>
      <span class="spacer"></span>
      <span id="notesHint" class="book-sub"></span>
      <span class="spacer"></span>
      <button class="btn primary" id="notesSaveBtn">Save</button>
    </div>
    <div class="notes-board" id="notesBoard">
      <div class="notes-surface" id="notesSurface">
        <svg class="notes-ink" id="notesInk"></svg>
        <div class="notes-notes" id="notesNotes"></div>
      </div>
    </div>
  </div>

  <!-- One-time setup for a cloud provider: a place to paste the client ID
       without having to edit a file and redeploy the site. -->
  <div id="setupOverlay" class="setup-overlay hidden">
    <div class="setup-card">
      <h2 id="setupTitle">Connect a drive</h2>
      <p class="setup-intro" id="setupIntro"></p>
      <ol class="setup-steps" id="setupSteps"></ol>

      <label class="setup-field">
        <span>This app's address — paste it where the steps ask for an origin</span>
        <input type="text" id="setupOrigin" readonly />
      </label>

      <label class="setup-field">
        <span id="setupInputLabel">Client ID</span>
        <input type="text" id="setupClientId" placeholder="Paste the client ID here"
               autocapitalize="off" autocorrect="off" spellcheck="false" />
      </label>
      <label class="setup-field hidden" id="setupBlobField">
        <span>Paste the whole firebaseConfig block</span>
        <textarea id="setupBlob" rows="7" placeholder='{ "apiKey": "...", "authDomain": "...", "projectId": "...", "appId": "..." }'
                  autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
      </label>

      <p class="setup-note" id="setupNote"></p>
      <div class="setup-actions">
        <button class="btn" id="setupCancel">Cancel</button>
        <button class="btn primary" id="setupSave">Save &amp; connect</button>
      </div>
    </div>
  </div>

  <!-- Choosing which cloud folder to sync with. On a second device this is
       how you join the folder the first device already created. -->
  <div id="folderOverlay" class="setup-overlay hidden">
    <div class="setup-card">
      <h2>Sync folder</h2>
      <p class="setup-intro" id="folderIntro"></p>
      <div class="folder-list" id="folderList"></div>
      <label class="setup-field">
        <span>Or create a new folder</span>
        <input type="text" id="newFolderName" placeholder="Folder name, e.g. Books" />
      </label>
      <div class="setup-actions">
        <button class="btn" id="folderCancel">Cancel</button>
        <button class="btn primary" id="folderCreate">Create &amp; use</button>
      </div>
    </div>
  </div>

  <!-- Sync tracker. One row per book saying where its file actually is, so
       "some of them aren't downloading" becomes a list you can point at and
       retry rather than a feeling. -->
  <div id="trackerOverlay" class="setup-overlay hidden">
    <div class="setup-card tracker-card">
      <h2>Books on this device</h2>
      <div class="tracker-summary" id="trackerSummary"></div>
      <div class="tracker-filters" id="trackerFilters">
        <button class="chip active" data-filter="all">All</button>
        <button class="chip" data-filter="missing">Not here yet</button>
        <button class="chip" data-filter="problem">Problems</button>
      </div>
      <div class="tracker-list" id="trackerList"></div>
      <div class="setup-actions">
        <button class="btn" id="trackerClose">Close</button>
        <button class="btn" id="trackerRefresh">Check again</button>
        <button class="btn primary" id="trackerRetry">Retry missing</button>
      </div>
    </div>
  </div>

<div class="toast" id="toast"></div>

<script type="module" src="js/main.js"></script>
<script>
  // Update handling. Without this, an installed copy can keep serving the
  // cached old build indefinitely — you reinstall and still see the previous
  // version. Here the page always revalidates sw.js, and when a new worker
  // takes control the page reloads itself once so you land on the new build.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", async () => {
      try {
        const reg = await navigator.serviceWorker.register("sw.js", { updateViaCache: "none" });
        reg.update();
        // Re-check when the app is brought back to the foreground.
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") reg.update();
        });
        window.__shelfCheckUpdate = () => reg.update();
      } catch (_) { /* offline or unsupported — the app still runs */ }

      let reloaded = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (reloaded) return;
        reloaded = true;
        window.location.reload();
      });
    });
  }
</script>
</body>
</html>
